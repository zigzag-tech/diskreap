[package]
name = "diskreap"
version = "0.6.0"
edition = "2021"
description = "Hang-proof disk scanner and safe, categorized cleaner for developer machines"
license = "MIT"

[dependencies]
clap = { version = "4.6.9", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
glob = "0.3.4"

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
