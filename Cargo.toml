[package]
name = "diskreap"
version = "0.1.0"
edition = "2021"
description = "Hang-proof disk scanner and safe, categorized cleaner for developer machines"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
